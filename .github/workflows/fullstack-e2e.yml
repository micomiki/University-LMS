name: LMS Full-Stack E2E

on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infrastructure/docker-compose.e2e.yml'
      - '.github/workflows/fullstack-e2e.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infrastructure/docker-compose.e2e.yml'
      - '.github/workflows/fullstack-e2e.yml'

jobs:
  fullstack-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres-e2e:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: university_lms_e2e
          POSTGRES_USER: lms_e2e
          POSTGRES_PASSWORD: local_e2e_only
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U lms_e2e -d university_lms_e2e"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Seed disposable E2E PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://lms_e2e:local_e2e_only@127.0.0.1:55433/university_lms_e2e
        run: python scripts/e2e_seed.py
      - name: Run full-stack browser tests
        working-directory: frontend
        run: npx playwright test --config playwright.fullstack.config.ts
      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lms-fullstack-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
