name: University LMS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend — pytest and PostgreSQL
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lms_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: university_lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms_user -d university_lms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      # Test-only credentials; this job never connects to your real LMS database.
      DATABASE_URL: postgresql+psycopg://lms_user:ci_test_password@localhost:5432/university_lms_test
      LMS_TEST_DATABASE_URL: postgresql+psycopg://lms_user:ci_test_password@localhost:5432/university_lms_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: ci_test_password
      POSTGRES_DB: university_lms_test
      SECRET_KEY: ci-only-secret-not-for-production
      JWT_SECRET_KEY: ci-only-secret-not-for-production
      PYTHONPATH: .

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx

      - name: Run 50 backend tests
        run: |
          python -m pytest -v \
            tests/test_assignment_workflow.py \
            tests/test_assignment_http_api.py \
            tests/test_postgres_submission_integrity.py

  frontend-tests:
    name: Frontend — TypeScript, Vitest, build
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Run 18 React tests
        run: npx vitest run --config vitest.config.ts

      - name: Build frontend
        run: npm run build
