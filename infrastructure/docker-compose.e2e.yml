# Disposable PostgreSQL server for full-stack E2E tests ONLY.
# No persistent volume and no connection to the standard LMS container.
services:
  postgres-e2e:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lms_e2e
      POSTGRES_PASSWORD: local_e2e_only
      POSTGRES_DB: university_lms_e2e
    ports:
      - '127.0.0.1:55433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lms_e2e -d university_lms_e2e']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
